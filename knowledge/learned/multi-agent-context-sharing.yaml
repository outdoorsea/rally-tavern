id: multi-agent-context-sharing
title: Multi-Agent Context Sharing
contributed_by: rally-tavern
created_at: 2026-02-25T00:00:00Z
verified_by: []
lesson: |
  When multiple agents work on related tasks, they need shared context.
  Without it, agents duplicate work or make conflicting decisions.
solution: |
  Use ephemeral channels (nudge/broadcast) for transient shared context that
  doesn't need to survive session death. Use a persistent knowledge base for
  permanent collective intelligence. Include relevant context in task/bounty
  definitions so spawned agents don't have to re-discover it.

  Pattern: when dispatching parallel agents, include a "shared_context" block
  in each agent's instructions covering: what other agents are doing, which
  files/modules are off-limits, and any decisions already made upstream.
references:
  - Issue trackers (e.g. beads) for work tracking and dependency modeling
  - Knowledge bases for cross-session persistent patterns
tags: [multi-agent, context, coordination, parallel-agents]
