created_at: 2026-03-17T00:00:00Z
verified_by: []
codebase_type: gas-town
summary: |
  When discovering bugs or tasks during work, file the bead in the rig that owns
  the affected code — not necessarily your current rig. The test is: "Which repo
  would the fix be committed to?"
details: |
  ## The Routing Rule

  File in the rig that OWNS the code you're reporting about:

  | Issue is about...           | File in        | Command                          |
  |-----------------------------|----------------|----------------------------------|
  | Your current rig's code     | Here (default) | `bd create "..."`                |
  | `bd` CLI (beads tool)       | beads          | `bd create --rig beads "..."`    |
  | `gt` CLI (gas town tool)    | gastown        | `bd create --rig gastown "..."`  |
  | Cross-rig coordination      | HQ             | `bd create --prefix hq- "..."`   |

  ## Prefix-Based Routing

  `bd` commands automatically route based on the issue ID prefix:
  ```bash
  bd show -xyz       # Routes to current rig beads
  bd show hq-abc     # Routes to town (HQ) beads
  ```

  Routes are defined in `$GT_ROOT/.beads/routes.jsonl`.
  Debug routing with: `BD_DEBUG_ROUTING=1 bd show <id>`

  ## Why This Matters

  - Beads filed in the wrong rig are invisible to the team that can actually fix them
  - Wrong-rig beads create noise for your own rig's triage
  - The witness and refinery process beads per-rig — misrouted beads may never be seen
gotchas:
  - Don't fix unrelated issues in your current branch — file a bead and move on
  - Use bd create, not gt issue create (the latter doesn't exist)
  - The --rig flag overrides the default routing based on your current location
tags: [gas-town, beads, routing, workflow, filing]
