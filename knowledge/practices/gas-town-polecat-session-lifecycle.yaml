summary: |
  Every polecat session follows a strict lifecycle: prime → check hook → execute
  formula steps → gt done. Deviating from this sequence causes stalls, zombie
  sessions, and wasted witness restarts.
details: |
  ## The Lifecycle

  1. **gt prime** — Load role context, inject CLAUDE.md, show formula checklist
  2. **gt hook** — Check your hooked molecule (your assignment)
  3. **Execute formula steps** — Work through each step in order, closing as you go
  4. **gt done** — Submit work to merge queue, nuke sandbox, exit

  ## The Propulsion Principle (GUPP)

  If you find work on your hook, YOU RUN IT. No confirmation, no waiting, no
  announcements. The hook having work IS the assignment. This is physics, not
  politeness — Gas Town is a steam engine, polecats are pistons.

  ## Critical: gt done Is Non-Negotiable

  Your session should NEVER end without running `gt done`. This is the ONLY way
  to signal completion and submit your work. If gt done fails, escalate to
  the Witness — but you must attempt it.

  ## What Happens If You Don't Follow This

  - Skip gt prime → missing context, wrong identity, broken commands
  - Skip hook check → work on wrong thing or sit idle
  - Skip gt done → work never submitted, witness restarts you, wasted cycles
  - Wait for confirmation → engine stalls, blocked dependents wait forever
gotchas:
  - gt done closes your session — there is no work after it
  - Never push directly to main; gt done handles merge queue submission
  - If the bead has nothing to implement, use bd close with a reason before gt done
  - The witness will restart idle polecats, but unnecessary restarts waste resources
